services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novatip
      POSTGRES_USER: novatip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novatip}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatip -d novatip"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://novatip:${POSTGRES_PASSWORD:-novatip}@db:5432/novatip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LICENSE_SERVER_URL: http://license_server:8100
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "1"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      license_server:
        condition: service_started

  worker:
    build: .
    command: ["celery", "-A", "novatip", "worker", "-l", "info"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://novatip:${POSTGRES_PASSWORD:-novatip}@db:5432/novatip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  beat:
    build: .
    command: ["celery", "-A", "novatip", "beat", "-l", "info"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://novatip:${POSTGRES_PASSWORD:-novatip}@db:5432/novatip
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      - worker

  license_server:
    build: .
    command: ["python", "license_server/manage_lite.py"]
    environment:
      LICENSE_SERVER_PORT: "8100"
      LICENSE_SERVER_SECRET: ${LICENSE_SERVER_SECRET:-dev-license-secret}
    ports:
      - "8100:8100"

volumes:
  pgdata:
  redisdata:
  media_data:
  static_data:
