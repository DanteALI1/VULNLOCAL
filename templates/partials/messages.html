{% if messages %}
  <div class="stack" style="margin-bottom:12px" role="status">
    {% for message in messages %}
      <div class="alert {% if 'error' in message.tags or 'danger' in message.tags %}warn{% elif 'success' in message.tags %}ok{% else %}info{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
